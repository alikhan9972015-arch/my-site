<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя соцсеть</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }
    header {
      background: #2a5885;
      color: white;
      padding: 15px;
      font-size: 20px;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
    }
    .post {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    .like {
      color: #2a5885;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      margin-top: 5px;
      padding: 8px;
    }
    .comment {
      background: #eee;
      padding: 5px;
      margin-top: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header>Моя соцсеть</header>

<div class="container">
  <div class="post">
    <p>Это мой первый пост 👋</p>

    <div>
      <span class="like" onclick="like()">❤️ Лайк</span>
      <span id="count">0</span>
    </div>

    <input id="commentInput" placeholder="Написать комментарий..." />
    <button onclick="addComment()">Отправить</button>

    <div id="comments"></div>
  </div>
</div>

<script>
  let likes = 0;

  function like() {
    likes++;
    document.getElementById("count").innerText = likes;
  }

  function addComment() {
    const text = document.getElementById("commentInput").value;
    if (text === "") return;

    const div = document.createElement("div");
    div.className = "comment";
    div.innerText = text;

    document.getElementById("comments").appendChild(div);
    document.getElementById("commentInput").value = "";
  }
</script>

</body>
</html>
