<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Моя соцсеть</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #edeef0;
}
header {
  background: #4c75a3;
  color: white;
  padding: 14px;
  font-size: 18px;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: 15px auto;
  padding: 0 10px;
}
.post {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  position: relative;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
}
.post-author {
  font-weight: 600;
  color: #2a5885;
}
.post-date {
  font-size: 12px;
  color: #818c99;
}
.like-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
}
.like-btn.liked {
  color: #e64646;
}
input, button {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #dce1e6;
}
button {
  background: #2a5885;
  color: white;
  cursor: pointer;
}
.delete-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: none;
  border: none;
  color: #e64646;
  font-size: 16px;
}
</style>
</head>

<body>

<header>Моя соцсеть</header>

<div class="container" id="loginBox">
  <div class="post">
    <button onclick="loginWithGoogle()">Войти через Google</button>
  </div>
</div>

<div class="container" id="app" style="display:none">
  <div class="post">
    <input id="postInput" placeholder="Что у тебя нового?" />
    <button onclick="addPost()">Опубликовать</button>
  </div>
  <div id="posts"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, getDoc,
  query, orderBy, doc, setDoc, deleteDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrjaL2v_fea2lCg-bxphpaZ7VK-twGFsk",
  authDomain: "my-social-site-a2c6f.firebaseapp.com",
  projectId: "my-social-site-a2c6f",
  storageBucket: "my-social-site-a2c6f.appspot.com",
  messagingSenderId: "891501245050",
  appId: "1:891501245050:web:a525b7d3396fc11f4401c3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const postsRef = collection(db, "posts");

let currentUser = null;

// helpers
const avatarLetter = n => n[0].toUpperCase();
const avatarColor = n =>
  `hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(),0)%360},60%,50%)`;

window.loginWithGoogle = () => {
  signInWithRedirect(auth, provider);
};

getRedirectResult(auth).catch(err => {
  console.error("Auth redirect error:", err);
});

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    loginBox.style.display = "none";
    app.style.display = "block";
    loadPosts();
  } else {
    currentUser = null;
    loginBox.style.display = "block";
    app.style.display = "none";
  }
});

window.addPost = async () => {
  if (!currentUser) return;
  const text = postInput.value.trim();
  if (!text) return;

  await addDoc(postsRef, {
    author: currentUser.displayName,
    authorId: currentUser.uid,
    text,
    created: Date.now(),
    likes: 0
  });

  postInput.value = "";
  loadPosts();
};

async function loadPosts() {
  if (!currentUser) return;

  const snap = await getDocs(query(postsRef, orderBy("created", "desc")));
  posts.innerHTML = "";

  for (const p of snap.docs) {
    const d = p.data();
    const id = p.id;

    const likeRef = doc(db, "posts", id, "likes", currentUser.uid);
    const liked = (await getDoc(likeRef)).exists();

    const el = document.createElement("div");
    el.className = "post";
    el.innerHTML = `
      ${d.authorId===currentUser.uid
        ? `<button class="delete-btn" onclick="deletePost('${id}')">🗑</button>`
        : ""}
      <div class="row">
        <div class="avatar" style="background:${avatarColor(d.author)}">
          ${avatarLetter(d.author)}
        </div>
        <div>
          <div class="post-author">${d.author}</div>
          <div class="post-date">${new Date(d.created).toLocaleString()}</div>
        </div>
      </div>
      <div style="margin:8px 0">${d.text}</div>
      <button class="like-btn ${liked?"liked":""}"
        onclick="toggleLike('${id}')">
        ${liked?"❤️":"🤍"} ${d.likes}
      </button>
    `;
    posts.appendChild(el);
  }
}

window.toggleLike = async postId => {
  const postRef = doc(db,"posts",postId);
  const likeRef = doc(db,"posts",postId,"likes",currentUser.uid);

  const postSnap = await getDoc(postRef);
  const likeSnap = await getDoc(likeRef);
  const count = postSnap.data().likes || 0;

  if (likeSnap.exists()) {
    await deleteDoc(likeRef);
    await updateDoc(postRef,{likes:Math.max(count-1,0)});
  } else {
    await setDoc(likeRef,{created:Date.now()});
    await updateDoc(postRef,{likes:count+1});
  }
  loadPosts();
};

window.deletePost = async id => {
  if (!confirm("Удалить пост?")) return;
  await deleteDoc(doc(db,"posts",id));
  loadPosts();
};
</script>

</body>
</html>
