<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя соцсеть</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }
    header {
      background: #2a5885;
      color: white;
      padding: 15px;
      font-size: 20px;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
    }
    .post {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    .like {
      color: #2a5885;
      cursor: pointer;
      display: inline-block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      margin-top: 5px;
      padding: 8px;
    }
    .comment {
      background: #eee;
      padding: 5px;
      margin-top: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header>Моя соцсеть</header>

<div class="container">
  <div class="post">
    <p>Это мой первый пост 👋</p>

    <div>
      <span class="like" onclick="like()">❤️ Лайк</span>
      <span id="count">0</span>
    </div>

    <input id="commentInput" placeholder="Написать комментарий..." />
    <button onclick="addComment()">Отправить</button>

    <div id="comments"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrjaL2v_fea2lCg-bxphpaZ7VK-twGFsk",
    authDomain: "my-social-site-a2c6f.firebaseapp.com",
    projectId: "my-social-site-a2c6f",
    storageBucket: "my-social-site-a2c6f.appspot.com",
    messagingSenderId: "891501245050",
    appId: "1:891501245050:web:a525b7d3396fc11f4401c3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const commentsRef = collection(db, "comments");

  let likes = 0;
  window.like = () => {
    likes++;
    document.getElementById("count").innerText = likes;
  };

  async function loadComments() {
    const q = query(commentsRef, orderBy("created", "asc"));
    const snapshot = await getDocs(q);
    const container = document.getElementById("comments");
    container.innerHTML = "";

    snapshot.forEach(doc => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerText = doc.data().text;
      container.appendChild(div);
    });
  }

  window.addComment = async () => {
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text) return;

    await addDoc(commentsRef, {
      text,
      created: Date.now()
    });

    input.value = "";
    loadComments();
  };

  loadComments();
</script>

</body>
</html>
