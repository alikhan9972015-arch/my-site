<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя соцсеть</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }
    header {
      background: #2a5885;
      color: white;
      padding: 15px;
      font-size: 20px;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
    }
    .post {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }
    button {
      margin-top: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    .comment {
      background: #eee;
      padding: 5px;
      margin-top: 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header>Моя соцсеть</header>

<div class="container">

  <!-- Создание поста -->
  <div class="post">
    <input id="postInput" placeholder="Что у тебя нового?" />
    <button onclick="addPost()">Опубликовать</button>
  </div>

  <!-- Лента постов -->
  <div id="posts"></div>

  <!-- Общие комментарии (пока) -->
  <div class="post">
    <input id="nameInput" placeholder="Твоё имя" />
    <input id="commentInput" placeholder="Написать комментарий..." />
    <button onclick="addComment()">Отправить</button>
    <div id="comments"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔹 Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDrjaL2v_fea2lCg-bxphpaZ7VK-twGFsk",
    authDomain: "my-social-site-a2c6f.firebaseapp.com",
    projectId: "my-social-site-a2c6f",
    storageBucket: "my-social-site-a2c6f.appspot.com",
    messagingSenderId: "891501245050",
    appId: "1:891501245050:web:a525b7d3396fc11f4401c3"
  };

  // 🔹 Init
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const postsRef = collection(db, "posts");
  const commentsRef = collection(db, "comments");

  // ➕ ДОБАВИТЬ ПОСТ
  window.addPost = async () => {
    const input = document.getElementById("postInput");
    const text = input.value.trim();
    if (!text) return;

    await addDoc(postsRef, {
      text: text,
      created: Date.now(),
      likes: 0
    });

    input.value = "";
    loadPosts();
  };

  // 📥 ЗАГРУЗКА ПОСТОВ
  async function loadPosts() {
    const q = query(postsRef, orderBy("created", "desc"));
    const snapshot = await getDocs(q);
    const container = document.getElementById("posts");
    container.innerHTML = "";

    snapshot.forEach(postDoc => {
      const data = postDoc.data();
      const postId = postDoc.id;

      const post = document.createElement("div");
      post.className = "post";

      post.innerHTML = `
        <p>${data.text}</p>
        <button onclick="likePost('${postId}', ${data.likes})">
          ❤️ ${data.likes}
        </button>
      `;

      container.appendChild(post);
    });
  }

  // ❤️ ЛАЙК ПОСТА (Firestore)
  window.likePost = async (postId, currentLikes) => {
    const postRef = doc(db, "posts", postId);
    await updateDoc(postRef, {
      likes: currentLikes + 1
    });
    loadPosts();
  };

  // 💬 ЗАГРУЗКА КОММЕНТАРИЕВ
  async function loadComments() {
    const q = query(commentsRef, orderBy("created", "asc"));
    const snapshot = await getDocs(q);
    const container = document.getElementById("comments");
    container.innerHTML = "";

    snapshot.forEach(doc => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerText = doc.data().name + ": " + doc.data().text;
      container.appendChild(div);
    });
  }

  // ➕ ДОБАВИТЬ КОММЕНТАРИЙ
  window.addComment = async () => {
    const nameInput = document.getElementById("nameInput");
    const commentInput = document.getElementById("commentInput");

    const name = nameInput.value.trim();
    const text = commentInput.value.trim();
    if (!name || !text) return;

    await addDoc(commentsRef, {
      name,
      text,
      created: Date.now()
    });

    nameInput.value = "";
    commentInput.value = "";
    loadComments();
  };

  // 🚀 СТАРТ
  loadPosts();
  loadComments();
</script>

</body>
</html>
