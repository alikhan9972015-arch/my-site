<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя соцсеть</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #edeef0;
    }
    header {
      background: #4c75a3;
      color: white;
      padding: 14px;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 15px auto;
      padding: 0 10px;
    }
    .post {
      background: white;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 8px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.05);
    }
    .post-author {
      font-weight: 600;
      color: #2a5885;
    }
    .post-text {
      margin: 6px 0;
    }
    .post-date {
      font-size: 12px;
      color: #818c99;
      margin-bottom: 8px;
    }
    .like-btn {
      background: none;
      border: none;
      color: #2a5885;
      cursor: pointer;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #dce1e6;
    }
    button {
      margin-top: 6px;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      background: #2a5885;
      color: white;
      cursor: pointer;
    }
    .comment {
      background: #f2f3f5;
      padding: 6px;
      margin-top: 5px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>Моя соцсеть</header>

<!-- 🔐 LOGIN -->
<div class="container" id="loginBox">
  <div class="post">
    <input id="loginName" placeholder="Как тебя зовут?" />
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- 🧠 APP -->
<div class="container" id="app" style="display:none">

  <div class="post">
    <input id="postInput" placeholder="Что у тебя нового?" />
    <button onclick="addPost()">Опубликовать</button>
  </div>

  <div id="posts"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    doc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrjaL2v_fea2lCg-bxphpaZ7VK-twGFsk",
    authDomain: "my-social-site-a2c6f.firebaseapp.com",
    projectId: "my-social-site-a2c6f",
    storageBucket: "my-social-site-a2c6f.appspot.com",
    messagingSenderId: "891501245050",
    appId: "1:891501245050:web:a525b7d3396fc11f4401c3"
  };

  const appFirebase = initializeApp(firebaseConfig);
  const db = getFirestore(appFirebase);
  const postsRef = collection(db, "posts");

  let currentUser = localStorage.getItem("user");

  // 🔐 AUTH
  window.login = () => {
    const name = loginName.value.trim();
    if (!name) return;

    localStorage.setItem("user", name);
    currentUser = name;
    loginBox.style.display = "none";
    app.style.display = "block";
    loadPosts();
  };

  function checkAuth() {
    if (currentUser) {
      loginBox.style.display = "none";
      app.style.display = "block";
      loadPosts();
    }
  }

  // ➕ POST
  window.addPost = async () => {
    const text = postInput.value.trim();
    if (!text) return;

    await addDoc(postsRef, {
      author: currentUser,
      text,
      created: Date.now(),
      likes: 0
    });

    postInput.value = "";
    loadPosts();
  };

  // 📥 POSTS
  async function loadPosts() {
    const q = query(postsRef, orderBy("created", "desc"));
    const snap = await getDocs(q);
    posts.innerHTML = "";

    snap.forEach(p => {
      const d = p.data();
      const id = p.id;

      const el = document.createElement("div");
      el.className = "post";
      el.innerHTML = `
        <div class="post-author">${d.author}</div>
        <div class="post-text">${d.text}</div>
        <div class="post-date">${new Date(d.created).toLocaleString()}</div>

        <button class="like-btn" onclick="likePost('${id}', ${d.likes})">
          ❤️ ${d.likes}
        </button>

        <input placeholder="Комментарий" id="comment-${id}">
        <button onclick="addComment('${id}')">Комментировать</button>
        <div id="comments-${id}"></div>
      `;
      posts.appendChild(el);
      loadComments(id);
    });
  }

  // ❤️ LIKE
  window.likePost = async (id, likes) => {
    await updateDoc(doc(db, "posts", id), { likes: likes + 1 });
    loadPosts();
  };

  // 💬 COMMENTS
  window.addComment = async (id) => {
    const text = document.getElementById(`comment-${id}`).value.trim();
    if (!text) return;

    await addDoc(collection(db, "posts", id, "comments"), {
      name: currentUser,
      text,
      created: Date.now()
    });

    document.getElementById(`comment-${id}`).value = "";
    loadComments(id);
  };

  async function loadComments(id) {
    const q = query(collection(db, "posts", id, "comments"), orderBy("created"));
    const snap = await getDocs(q);
    const box = document.getElementById(`comments-${id}`);
    box.innerHTML = "";

    snap.forEach(c => {
      const d = c.data();
      const div = document.createElement("div");
      div.className = "comment";
      div.textContent = `${d.name}: ${d.text}`;
      box.appendChild(div);
    });
  }

  checkAuth();
</script>

</body>
</html>
