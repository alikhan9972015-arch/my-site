<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrjaL2v_fea2lCg-bxphpaZ7VK-twGFsk",
  authDomain: "my-social-site-a2c6f.firebaseapp.com",
  projectId: "my-social-site-a2c6f",
  storageBucket: "my-social-site-a2c6f.appspot.com",
  messagingSenderId: "891501245050",
  appId: "1:891501245050:web:a525b7d3396fc11f4401c3"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const commentsRef = collection(db, "comments");

  // ЛАЙК (локально)
  let likes = 0;
  window.like = function () {
    likes++;
    document.getElementById("count").innerText = likes;
  };

  // ЗАГРУЗКА КОММЕНТАРИЕВ
  async function loadComments() {
    const q = query(commentsRef, orderBy("created", "asc"));
    const snapshot = await getDocs(q);
    const container = document.getElementById("comments");
    container.innerHTML = "";

    snapshot.forEach(doc => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerText = doc.data().text;
      container.appendChild(div);
    });
  }

  // ДОБАВЛЕНИЕ КОММЕНТАРИЯ
  window.addComment = async function () {
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text) return;

    await addDoc(commentsRef, {
      text: text,
      created: Date.now()
    });

    input.value = "";
    loadComments();
  };

  loadComments();
</script>
